<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Checkout - Wayfair</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #fff; color: #2b2b2b; }
        .header { background: #7B2D8B; padding: 16px 40px; display: flex; align-items: center; justify-content: space-between; }
        .logo { color: white; font-size: 28px; font-weight: bold; letter-spacing: -1px; }
        .nav-links { color: white; display: flex; gap: 20px; font-size: 14px; }
        .wrap { padding: 34px 40px; display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 32px; align-items: start; }
        h1 { font-size: 28px; margin-bottom: 20px; }
        .section { border-top: 1px solid #e7e2ea; padding: 22px 0; }
        .section h2 { font-size: 19px; margin-bottom: 16px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        label { display: block; font-size: 13px; color: #635868; margin-bottom: 6px; }
        input { width: 100%; padding: 12px; border: 1px solid #cfc6d4; border-radius: 4px; font-size: 15px; }
        .wide { grid-column: 1 / -1; }
        .summary { border: 1px solid #e1dce5; border-radius: 8px; padding: 22px; position: sticky; top: 24px; }
        .summary h2 { font-size: 20px; margin-bottom: 18px; }
        .item { display: flex; gap: 10px; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee8f1; font-size: 14px; }
        .row { display: flex; justify-content: space-between; padding: 8px 0; color: #49424c; }
        .total { display: flex; justify-content: space-between; border-top: 1px solid #e1dce5; margin-top: 12px; padding-top: 16px; font-size: 22px; font-weight: 800; }
        .place { width: 100%; margin-top: 18px; background: #7B2D8B; color: white; border: 0; border-radius: 4px; padding: 15px 18px; font-size: 17px; font-weight: 700; cursor: pointer; }
        @media (max-width: 820px) { .wrap { grid-template-columns: 1fr; padding: 24px; } .grid { grid-template-columns: 1fr; } .wide { grid-column: auto; } }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">Wayfair</div>
        <div class="nav-links"><span>Secure Checkout</span><span>Cart</span></div>
    </div>
    <main class="wrap">
        <section>
            <h1>Checkout</h1>
            <div class="section">
                <h2>Contact</h2>
                <div class="grid">
                    <div><label>Email</label><input value="alex.shopper@example.com"></div>
                    <div><label>Phone</label><input value="(555) 010-2048"></div>
                </div>
            </div>
            <div class="section">
                <h2>Shipping Address</h2>
                <div class="grid">
                    <div><label>First Name</label><input value="Alex"></div>
                    <div><label>Last Name</label><input value="Shopper"></div>
                    <div class="wide"><label>Address</label><input value="123 Mockingbird Lane"></div>
                    <div><label>City</label><input value="Boston"></div>
                    <div><label>State</label><input value="MA"></div>
                    <div><label>ZIP</label><input value="02118"></div>
                </div>
            </div>
            <div class="section">
                <h2>Payment</h2>
                <div class="grid">
                    <div class="wide"><label>Card Number</label><input value="4242 4242 4242 4242"></div>
                    <div><label>Expiration</label><input value="12/30"></div>
                    <div><label>CVV</label><input value="123"></div>
                </div>
            </div>
        </section>
        <aside class="summary">
            <h2>Review Order</h2>
            <div id="items"></div>
            <div class="row"><span>Subtotal</span><span id="subtotal">$0.00</span></div>
            <div class="row"><span>Shipping</span><span>Free</span></div>
            <div class="row"><span>Estimated Tax</span><span id="tax">$0.00</span></div>
            <div class="total"><span>Total</span><span id="total">$0.00</span></div>
            <button class="place" onclick="location.href='confirmation.html'">Place Order</button>
        </aside>
    </main>
    <script>
        const CART_KEY = 'wayfair_voice_cart';
        const ORDER_KEY = 'wayfair_voice_last_order';
        const money = value => `$${value.toFixed(2)}`;
        const cart = JSON.parse(localStorage.getItem(CART_KEY) || '[]');
        const subtotal = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);
        const tax = Math.round(subtotal * 0.0825 * 100) / 100;
        const total = subtotal + tax;
        document.getElementById('items').innerHTML = cart.map(item => `
            <div class="item"><span>${item.quantity} ${item.unit}${item.quantity === 1 ? '' : 's'} · ${item.name}</span><strong>${money(item.price * item.quantity)}</strong></div>
        `).join('');
        document.getElementById('subtotal').textContent = money(subtotal);
        document.getElementById('tax').textContent = money(tax);
        document.getElementById('total').textContent = money(total);
        document.querySelector('.place').addEventListener('click', () => {
            const order = { orderNumber: 'WF-MOCK-1047', items: cart, subtotal, shipping: 0, tax, total };
            localStorage.setItem(ORDER_KEY, JSON.stringify(order));
            localStorage.removeItem(CART_KEY);
        });
    </script>
</body>
</html>
